<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Praten · Néerlandais</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Praten">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Thème mémorisé, puis niveau de rendu : « fx » (ordinateur : animations et effets) ou version légère (téléphone, tablette, animations réduites)
    (function () {
      var d = document.documentElement;
      try { var t = localStorage.getItem('applangues-theme'); if (t) d.dataset.theme = t; } catch (e) { }
      var q = matchMedia('(max-width: 860px), (pointer: coarse), (prefers-reduced-motion: reduce)');
      var set = function () { d.classList.toggle('fx', !q.matches); };
      set(); if (q.addEventListener) q.addEventListener('change', set);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#today"></a>
      <nav id="nav" aria-label="Rubriques"></nav>
      <div class="top-right">
        <div class="today-chip" id="todayChip" title="Temps de pratique aujourd’hui"></div>
        <div class="top-tools">
          <select class="speed-sel" id="speedSel" title="Vitesse de lecture" aria-label="Vitesse de lecture"></select>
          <button class="icon-btn" id="themeBtn" type="button"></button>
          <a class="icon-btn" title="Réglages" aria-label="Réglages" id="gearLink"></a>
        </div>
      </div>
    </div>
  </header>
  <main id="view"></main>
  <div class="sheet hidden" id="moreSheet"><div class="sheet-box" id="moreBox"></div></div>

  <button class="fab" id="fabBouee" title="Un mot me manque" aria-label="Un mot me manque"></button>
  <div class="modal hidden" id="modal"><div class="modal-box" id="modalBox"></div></div>

  <!-- Propre à la langue -->
  <script src="js/lang.js"></script>
  <script src="js/conjugator.js"></script>
  <script src="js/data/vocab.js"></script>
  <script src="js/data/grammar.js"></script>
  <script src="js/data/scenarios.js"></script>
  <script src="js/data/sounds.js"></script>
  <!-- Moteur commun -->
  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
